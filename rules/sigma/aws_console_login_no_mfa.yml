title: AWS Console Login Without MFA
id: 7c1b1e2a-1a2b-4c3d-9e4f-000000000003
status: stable
description: >
  Detects a successful AWS Management Console login where MFA was not
  used, increasing the risk of credential-based account takeover.
author: Zi'Aire Tirado
date: 2026/09/09
references:
  - https://attack.mitre.org/techniques/T1078/004/
tags:
  - attack.initial_access
  - attack.t1078.004
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    eventName: ConsoleLogin
    responseElements.ConsoleLogin: Success
    additionalEventData.MFAUsed: 'No'
  condition: selection
falsepositives:
  - Break-glass accounts intentionally exempted from MFA policy
level: medium
